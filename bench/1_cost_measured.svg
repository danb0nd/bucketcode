<style>.bg{fill:#fbfbfa}.ax{stroke:#c9c9c5}.gr{stroke:#ececea}.t{font-size:15.5px;font-weight:600;fill:#1a1d21}.s{font-size:11.5px;fill:#6b7280}.lab{font-size:10.5px;fill:#6b7280}.k{font-size:11.5px;font-weight:600}@media(prefers-color-scheme:dark){.bg{fill:#0d0f12}.ax{stroke:#3a4049}.gr{stroke:#1e222a}.t{fill:#e3e6ea}}</style>
<rect class="bg" width="760" height="420"/>
<text class="t" x="66" y="28">Cost of one edit: buckets vs whole file</text>
<text class="s" x="66" y="47">Measured against the live API. Same task, same model (Sonnet 5), same gates on both arms.</text>

<circle cx="439.2" cy="140.5" r="3.4" fill="#b3462c"/>
<circle cx="598.0" cy="90.2" r="3.4" fill="#b3462c"/>
<text class="k" x="607" y="94.2" fill="#b3462c">whole file</text>
<path d="M260.3,169.2 L439.2,167.3 L598.0,168.1" fill="none" stroke="#1d7a4c" stroke-width="2.4"/>

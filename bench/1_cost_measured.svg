<text class="lab" x="58" y="266.0" text-anchor="end">10</text>
<line class="gr" x1="66" y1="170.0" x2="598" y2="170.0"/>
<text class="lab" x="58" y="174.0" text-anchor="end">100</text>
<line class="gr" x1="66" y1="78.0" x2="598" y2="78.0"/>
<text class="lab" x="58" y="82.0" text-anchor="end">1,000</text>

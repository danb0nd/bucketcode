<text class="lab" x="598.0" y="371" text-anchor="middle">82</text>
<text class="lab" x="332.0" y="406" text-anchor="middle">buckets in program (log scale)</text>
<text class="lab" x="17" y="216.0" text-anchor="middle" transform="rotate(-90 17 216.0)">USD ×10⁴ (log)</text>
<path d="M260.3,188.5 L439.2,140.5 L598.0,90.2" fill="none" stroke="#b3462c" stroke-width="2.4"/>
